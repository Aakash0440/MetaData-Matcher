metrics:
- name: Applications approved
  description: Number of applications with status Approved.
  sql: SELECT COUNT(*) AS value FROM "app" AS m WHERE m."sts_cd" = 'APR'
  sql_by_dimensions: SELECT j1."schm_nm" AS "Scheme", j4."org_nm" AS "Local authority", COUNT(*) AS value FROM "app"
    AS m JOIN "schm" AS j1 ON m."schm_id" = j1."schm_id" JOIN "hh" AS j2 ON m."hh_id" = j2."hh_id" JOIN "prop" AS
    j3 ON j2."prop_id" = j3."prop_id" JOIN "org" AS j4 ON j3."la_org_id" = j4."org_id" WHERE m."sts_cd" = 'APR'
    GROUP BY 1, 2 ORDER BY value DESC NULLS LAST LIMIT 100
  dimensions:
  - Scheme
  - Local authority
  depends_on:
  - app.schm_id->schm.schm_id
  - app.hh_id->hh.hh_id
  - hh.prop_id->prop.prop_id
  - prop.la_org_id->org.org_id
  result_when_approved: 169.0
  confidence: 0.97
  status: approved
- name: Average EPC score improvement
  description: Average change in EPC score between a property's first and latest certificate.
  sql: SELECT AVG(m."delta") AS value FROM (SELECT x."prop_id" AS "prop_id", (array_agg(x."curr_scr" ORDER BY x."lodg_dt"
    DESC, x."cert_id" DESC))[1] - (array_agg(x."curr_scr" ORDER BY x."lodg_dt" ASC, x."cert_id" ASC))[1] AS delta
    FROM "epc_cert" AS x WHERE x."curr_scr" IS NOT NULL AND x."lodg_dt" IS NOT NULL AND x."prop_id" IS NOT NULL
    GROUP BY x."prop_id" HAVING COUNT(*) > 1) AS m
  sql_by_dimensions: SELECT j2."org_nm" AS "Local authority", AVG(m."delta") AS value FROM (SELECT x."prop_id" AS
    "prop_id", (array_agg(x."curr_scr" ORDER BY x."lodg_dt" DESC, x."cert_id" DESC))[1] - (array_agg(x."curr_scr"
    ORDER BY x."lodg_dt" ASC, x."cert_id" ASC))[1] AS delta FROM "epc_cert" AS x WHERE x."curr_scr" IS NOT NULL
    AND x."lodg_dt" IS NOT NULL AND x."prop_id" IS NOT NULL GROUP BY x."prop_id" HAVING COUNT(*) > 1) AS m JOIN
    "prop" AS j1 ON m."prop_id" = j1."prop_id" JOIN "org" AS j2 ON j1."la_org_id" = j2."org_id" GROUP BY 1 ORDER
    BY value DESC NULLS LAST LIMIT 100
  dimensions:
  - Local authority
  depends_on:
  - epc_cert.prop_id->prop.prop_id
  - prop.la_org_id->org.org_id
  result_when_approved: 14.876923076923077
  confidence: 0.95
  status: approved
- name: Average measure cost
  description: Average installed cost of a measure.
  sql: SELECT AVG(m."cost_amt") AS value FROM "msr" AS m
  sql_by_dimensions: SELECT j2."schm_nm" AS "Scheme", m."msr_typ_cd" AS "Measure type", AVG(m."cost_amt") AS value
    FROM "msr" AS m JOIN "app" AS j1 ON m."app_id" = j1."app_id" JOIN "schm" AS j2 ON j1."schm_id" = j2."schm_id"
    GROUP BY 1, 2 ORDER BY value DESC NULLS LAST LIMIT 100
  dimensions:
  - Scheme
  - Measure type
  depends_on:
  - msr.app_id->app.app_id
  - app.schm_id->schm.schm_id
  result_when_approved: 7071.704978723405
  confidence: 0.98
  status: approved
- name: Total grant paid
  description: Sum of all payments made against applications.
  sql: SELECT SUM(m."pymt_amt") AS value FROM "pymt" AS m
  sql_by_dimensions: SELECT j2."schm_nm" AS "Scheme", j5."org_nm" AS "Local authority", SUM(m."pymt_amt") AS value
    FROM "pymt" AS m JOIN "app" AS j1 ON m."app_id" = j1."app_id" JOIN "schm" AS j2 ON j1."schm_id" = j2."schm_id"
    JOIN "hh" AS j3 ON j1."hh_id" = j3."hh_id" JOIN "prop" AS j4 ON j3."prop_id" = j4."prop_id" JOIN "org" AS j5
    ON j4."la_org_id" = j5."org_id" GROUP BY 1, 2 ORDER BY value DESC NULLS LAST LIMIT 100
  dimensions:
  - Scheme
  - Local authority
  depends_on:
  - pymt.app_id->app.app_id
  - app.schm_id->schm.schm_id
  - app.hh_id->hh.hh_id
  - hh.prop_id->prop.prop_id
  - prop.la_org_id->org.org_id
  result_when_approved: 1583180.33
  confidence: 0.975
  status: approved
